<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Habit Tracker — flexible weekly habits</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand-block">
        <h1>Habit Tracker</h1>
        <p>Flexible weekly habits, without broken-streak guilt.</p>
      </div>
      <nav class="tabs" role="tablist" aria-label="Habit Tracker sections">
        <button class="tab-btn active" id="tab-btn-today" role="tab" aria-selected="true" aria-controls="tab-today" data-tab="today">Today</button>
        <button class="tab-btn" id="tab-btn-week" role="tab" aria-selected="false" aria-controls="tab-week" data-tab="week">History</button>
        <button class="tab-btn" id="tab-btn-books" role="tab" aria-selected="false" aria-controls="tab-books" data-tab="books">Books</button>
        <button class="tab-btn" id="tab-btn-insights" role="tab" aria-selected="false" aria-controls="tab-insights" data-tab="insights">Insights</button>
        <button class="tab-btn" id="tab-btn-habits" role="tab" aria-selected="false" aria-controls="tab-habits" data-tab="habits">Habits</button>
      </nav>
    </header>

    <main>
      <section id="tab-today" class="tab-panel active" role="tabpanel" aria-labelledby="tab-btn-today" tabindex="0"></section>
      <section id="tab-week" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-week" tabindex="0" hidden></section>
      <section id="tab-books" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-books" tabindex="0" hidden></section>
      <section id="tab-insights" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-insights" tabindex="0" hidden></section>
      <section id="tab-habits" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-habits" tabindex="0" hidden></section>
    </main>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
