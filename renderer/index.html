<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>Habit Tracker</h1>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="today">Today</button>
        <button class="tab-btn" data-tab="week">Week</button>
        <button class="tab-btn" data-tab="habits">Habits</button>
        <button class="tab-btn" data-tab="insights">Insights</button>
      </nav>
    </header>

    <main>
      <section id="tab-today" class="tab-panel active"></section>
      <section id="tab-week" class="tab-panel"></section>
      <section id="tab-habits" class="tab-panel"></section>
      <section id="tab-insights" class="tab-panel"></section>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="renderer.js"></script>
</body>
</html>
